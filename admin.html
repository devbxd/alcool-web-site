<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whiskey & More — Ajouter un produit</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#0b0a09; --panel:#17140f; --cream:#f3ecdf; --cream-dim:#cfc4ad;
    --gold:#c8a862; --gold-bright:#e4c988; --line:rgba(200,168,98,.25);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--black); color:var(--cream);
    font-family:'Jost', Arial, sans-serif; font-weight:400;
    display:flex; justify-content:center; padding:40px 18px 80px;
  }
  .card{ width:100%; max-width:480px; }
  .brand{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:8px; }
  .brand__mark{ width:26px; }
  .brand span{ font-family:'Playfair Display', serif; font-size:1.3rem; letter-spacing:.08em; }
  h1{
    font-family:'Playfair Display', serif; font-weight:600; font-size:1.5rem;
    text-align:center; margin:6px 0 34px; color:var(--cream);
  }
  label{ display:block; font-size:.85rem; color:var(--cream-dim); margin:20px 0 8px; }
  input, select, textarea{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--cream);
    padding:14px; font-family:inherit; font-size:1rem; border-radius:2px;
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--gold); }
  textarea{ resize:vertical; min-height:80px; }
  input[type="file"]{ padding:10px; }
  button{
    width:100%; margin-top:30px; padding:16px; border:none; border-radius:2px;
    background:var(--gold); color:var(--black); font-family:inherit; font-size:1rem;
    font-weight:600; letter-spacing:.05em; cursor:pointer;
  }
  button:disabled{ opacity:.5; cursor:default; }
  button:hover:not(:disabled){ background:var(--gold-bright); }
  #status{ text-align:center; margin-top:18px; font-size:.9rem; min-height:1.2em; }
  #status.ok{ color:#8fce9a; }
  #status.err{ color:#e08a8a; }

  .list-head{
    font-family:'Playfair Display', serif; font-size:1.15rem; margin:60px 0 18px; text-align:center;
  }
  .product-row{
    display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line);
  }
  .product-row__thumb{
    width:46px; height:58px; object-fit:cover; background:var(--panel); flex-shrink:0; border:1px solid var(--line);
  }
  .product-row__info{ flex:1; min-width:0; }
  .product-row__name{ font-size:.95rem; }
  .product-row__meta{ font-size:.8rem; color:var(--cream-dim); }
  .product-row__del{
    background:none; border:1px solid rgba(224,138,138,.4); color:#e08a8a;
    width:auto; margin:0; padding:8px 14px; font-size:.75rem; letter-spacing:.05em; border-radius:2px;
  }
  .product-row__del:hover{ background:rgba(224,138,138,.12); }
  .empty-note{ text-align:center; color:var(--cream-dim); font-size:.9rem; padding:20px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <svg class="brand__mark" viewBox="60 52 104 86" aria-hidden="true"><polygon points="66,58 124,58 128,66 100,132 72,66" fill="#cfc4ad"/><polygon points="100,58 158,58 132,132 100,66" fill="#f3ecdf"/></svg>
    <span>Whiskey &amp; More</span>
  </div>
  <h1>Ajouter un produit sur le site</h1>

  <form id="productForm">
    <label for="name">Nom du produit</label>
    <input type="text" id="name" required placeholder="Ex : Macallan 12 ans">

    <label for="price">Prix ($)</label>
    <input type="number" id="price" required min="0" step="0.01" placeholder="Ex : 75">

    <label for="category">Catégorie</label>
    <select id="category" required>
      <option value="whisky">Whisky</option>
      <option value="vodka">Vodka</option>
      <option value="tequila">Tequila</option>
      <option value="cognac">Cognac</option>
      <option value="champagne">Champagne</option>
      <option value="vins">Vin</option>
      <option value="rhum">Rhum</option>
      <option value="gin">Gin</option>
    </select>

    <label for="description">Description (facultatif)</label>
    <textarea id="description" placeholder="Une courte description du produit"></textarea>

    <label for="photo">Photo du produit</label>
    <input type="file" id="photo" accept="image/*">

    <button type="submit" id="submitBtn">Ajouter le produit</button>
    <p id="status"></p>
  </form>

  <p class="list-head">Produits déjà ajoutés</p>
  <div id="productList"></div>
</div>

<script>
const SUPABASE_URL = "https://jpxlqismhmgwhkrzqcvc.supabase.co";
const SUPABASE_KEY = "sb_publishable_oNU9YVWCPeJQrE4wJbeHvA_ihyg3m2h";
const H = { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` };

const form = document.getElementById("productForm");
const statusEl = document.getElementById("status");
const submitBtn = document.getElementById("submitBtn");
const listEl = document.getElementById("productList");

function setStatus(text, kind){
  statusEl.textContent = text;
  statusEl.className = kind || "";
}

async function uploadPhoto(file){
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/product-photos/${path}`, {
    method: "POST",
    headers: { ...H, "Content-Type": file.type || "image/jpeg" },
    body: file,
  });
  if(!res.ok) throw new Error("upload failed");
  return `${SUPABASE_URL}/storage/v1/object/public/product-photos/${path}`;
}

async function loadProducts(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=created_at.desc`, { headers: H });
  const data = await res.json();
  if(data.length === 0){
    listEl.innerHTML = `<p class="empty-note">Aucun produit pour l'instant.</p>`;
    return;
  }
  listEl.innerHTML = data.map(p => `
    <div class="product-row">
      ${p.image_url ? `<img class="product-row__thumb" src="${p.image_url}">` : `<div class="product-row__thumb"></div>`}
      <div class="product-row__info">
        <div class="product-row__name">${p.name}</div>
        <div class="product-row__meta">$${p.price} — ${p.category}</div>
      </div>
      <button class="product-row__del" data-id="${p.id}">Supprimer</button>
    </div>
  `).join("");
}

listEl.addEventListener("click", async (e)=>{
  const btn = e.target.closest(".product-row__del");
  if(!btn) return;
  if(!confirm("Supprimer ce produit ?")) return;
  btn.disabled = true;
  await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${btn.dataset.id}`, {
    method: "DELETE",
    headers: H,
  });
  loadProducts();
});

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  submitBtn.disabled = true;
  setStatus("Ajout en cours…");

  try{
    const name = document.getElementById("name").value.trim();
    const price = parseFloat(document.getElementById("price").value);
    const category = document.getElementById("category").value;
    const description = document.getElementById("description").value.trim();
    const file = document.getElementById("photo").files[0];

    let image_url = null;
    if(file) image_url = await uploadPhoto(file);

    const res = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
      method: "POST",
      headers: { ...H, "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify({ name, price, category, description, image_url }),
    });
    if(!res.ok) throw new Error("insert failed");

    form.reset();
    setStatus("✓ Produit ajouté !", "ok");
    loadProducts();
  } catch(err){
    setStatus("Une erreur est survenue, réessayez.", "err");
  } finally {
    submitBtn.disabled = false;
  }
});

loadProducts();
</script>
</body>
</html>
